<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Requests — TruthBridge Admin</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    body { font-size: 16px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 20px 0; }
    .bar input[type=search] { max-width: 280px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab { border: 1.5px solid var(--line); background: var(--card); padding: 7px 14px; border-radius: 999px; cursor: pointer; font: inherit; }
    .tab[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn-sm { padding: 8px 14px; font-size: .9rem; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: .93rem; }
    th { background: var(--paper-2); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: #eee; }
    .pill.new { background: #fff1d6; color: #7a5300; }
    .pill.packed { background: #e3ecfb; color: #234a8a; }
    .pill.shipped { background: #e3f3e9; color: #2f6b4f; }
    .pill.cancelled { background: #f1e3e3; color: #8a2b2b; }
    .dup { color: var(--err); font-size: .8rem; font-weight: 600; }
    .muted { color: var(--ink-soft); font-size: .85rem; }
    .msg { white-space: pre-wrap; max-width: 320px; }
    .table-wrap { overflow-x: auto; }
    #login { max-width: 420px; margin: 80px auto; }
    td select { padding: 6px; font-size: .88rem; }
  </style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><img src="/assets/logo.svg" alt="" width="36" height="36"><span>TruthBridge · Requests</span></a>
    <nav class="nav"><a href="#" id="logout" hidden>Sign out</a></nav>
  </div>
</header>

<main class="wrap">
  <form id="login" class="form-card">
    <h2>Volunteer sign-in</h2>
    <label for="token">Admin password</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <div style="margin-top:16px"><button class="btn" type="submit">Sign in</button></div>
    <div id="login-msg" class="form-msg"></div>
  </form>

  <div id="app" hidden>
    <div class="bar">
      <div class="tabs" id="tabs"></div>
      <input type="search" id="q" placeholder="Search name, city, postal…">
      <span style="flex:1"></span>
      <button class="btn btn-ghost btn-sm" id="mark-packed">Mark selected packed</button>
      <button class="btn btn-sm" id="mark-shipped">Mark selected shipped</button>
      <button class="btn btn-ghost btn-sm" id="export">Download CSV</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th><input type="checkbox" id="all" aria-label="Select all"></th>
          <th>#</th><th>Received</th><th>Name &amp; address</th><th>Bible</th><th>Note</th><th>Status</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="muted" id="footnote"></p>
  </div>
</main>

<script src="/admin/admin.js" defer></script>
</body>
</html>
